name: Feature request
description: Suggest a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: A short example is helpful.
